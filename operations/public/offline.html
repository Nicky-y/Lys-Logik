<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#182a29" />
    <title>Lys & Logik · Ingen forbindelse</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7f2;
        color: #182a29;
        font:
          17px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      h1 {
        font-size: 30px;
        line-height: 1.2;
        margin-top: 28px;
      }
      p {
        color: #526256;
      }
      a {
        display: inline-block;
        background: #182a29;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        padding: 14px 22px;
        margin-top: 16px;
        font-weight: 650;
      }
      a:focus-visible {
        outline: 3px solid #b88112;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-v12-192.png" alt="Lys & Logik" />
      <h1>Vi mangler forbindelsen.</h1>
      <p>
        Arbejdsrummet kan ikke åbnes lige nu. Kontrollér dit netværk, og prøv
        igen.
      </p>
      <p>
        Sager og aftaler kræver netforbindelse. Der gemmes ingen handlinger til
        senere afsendelse.
      </p>
      <a href="/">Prøv igen</a>
    </main>
  </body>
</html>
